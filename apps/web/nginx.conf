server {
  listen 80;
  # No per-request access logs; errors still go to the error log.
  access_log off;
  root /usr/share/nginx/html;

  # Same contract as the Vite dev proxy: /api/* -> api service, prefix stripped.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    client_max_body_size 20m;
  }

  # The image's mime.types has no `mjs` entry, so the pdf.js worker would go out as
  # application/octet-stream and browsers refuse it as a module worker. Static files only,
  # no SPA fallback: a missing .mjs must 404, not return index.html.
  location ~ \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
  }

  # SPA fallback so /documents/:id deep links work.
  location / {
    try_files $uri /index.html;
  }
}
