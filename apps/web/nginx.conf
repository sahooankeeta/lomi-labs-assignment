server {
  listen 80;
  # No per-request access logs; errors still go to the error log.
  access_log off;
  root /usr/share/nginx/html;

  # Same contract as the Vite dev proxy: /api/* -> api service, prefix stripped.
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    client_max_body_size 20m;
  }

  # SPA fallback so /documents/:id deep links work.
  location / {
    try_files $uri /index.html;
  }
}
